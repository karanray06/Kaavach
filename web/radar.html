<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavach - Radar</title>
    <link rel="stylesheet" href="/static/tokens.css">
    <style>
        .radar-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1px;
            background: var(--grid);
            border: 1px solid var(--grid);
            margin-bottom: 80px;
        }
        @media (min-width: 1024px) {
            .radar-grid {
                grid-template-columns: 320px 1fr 320px;
            }
        }
        .radar-panel {
            background: var(--surface);
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .canvas-container {
            position: relative;
            background: var(--bg);
            min-height: 400px;
            overflow: hidden;
            border-bottom: 1px solid var(--grid);
        }
        @media (min-width: 1024px) {
            .canvas-container { border-bottom: none; }
        }
        canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            mix-blend-mode: luminosity;
        }
        
        .data-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .bar-container {
            flex-grow: 1;
            height: 4px;
            background: var(--grid);
            position: relative;
        }
        .bar-fill {
            height: 100%;
            background: var(--ink);
            position: absolute;
            top: 0; left: 0;
        }

        .nlq-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg);
            border-top: 1px solid var(--grid);
            padding: 16px;
            z-index: 100;
        }
        .nlq-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .nlq-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .nlq-response {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--ink);
            display: none;
            padding-bottom: 8px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo-box">K</a>
            <div class="nav-links mono">
                <a href="/scan">01. SCAN</a>
                <a href="/radar" style="color:var(--coral);">02. RADAR</a>
                <a href="/drill">03. DRILL</a>
            </div>
            <div style="display:flex; gap:12px;">
                <a href="/" class="btn btn-ghost">HOME</a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 1400px;">
        <div class="radar-grid">
            <!-- Left Panel: Trends -->
            <div class="radar-panel">
                <div class="status-badge" style="align-self: flex-start; margin-bottom: 8px;">
                    <div class="status-dot"></div>
                    <span class="mono">LIVE TELEMETRY</span>
                </div>
                <h2 class="heading heading-md">TRENDS</h2>
                <div class="mono text-neutral" id="trendsSource">LOADING DATA...</div>
                
                <div class="data-list" id="trendsList" style="margin-top: 16px;">
                    <div class="mono text-neutral">FETCHING TRENDS...</div>
                </div>
            </div>

            <!-- Center Panel: Graph -->
            <div class="canvas-container">
                <div class="mono" style="position:absolute; top:24px; left:24px; z-index:10; font-size:14px;">[ TOPOLOGY GRAPH ]</div>
                <canvas id="campaignGraph"></canvas>
            </div>

            <!-- Right Panel: Campaigns -->
            <div class="radar-panel">
                <div class="status-badge" style="align-self: flex-start; margin-bottom: 8px;">
                    <div class="status-dot"></div>
                    <span class="mono">CLUSTER SYNC</span>
                </div>
                <h2 class="heading heading-md">CAMPAIGNS</h2>
                <div class="mono text-neutral" id="campaignsSource">ACTIVE CAMPAIGNS</div>
                
                <div class="data-list" id="campaignsList" style="margin-top: 16px;">
                    <div class="mono text-neutral">FETCHING CAMPAIGNS...</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="nlq-bar">
        <div class="nlq-container">
            <div class="nlq-response" id="queryResponse"></div>
            <div class="nlq-row">
                <span class="mono text-neutral">LOCAL FILTER:</span>
                <input type="text" id="queryInput" placeholder="Filter tactics or campaigns (e.g. KYC, C-0042)..." style="flex-grow:1; background:transparent; border:none; border-bottom:1px solid var(--ink); padding:8px 0; outline:none;">
                <button class="btn btn-primary" id="queryBtn" style="padding: 8px 16px;">FILTER</button>
            </div>
        </div>
    </div>

    <script src="/static/dist/reveal.js"></script>
    <script src="/static/dist/radar.js"></script>
</body>
</html>
