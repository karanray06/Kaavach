<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavach - Radar</title>
    <link rel="stylesheet" href="/static/tokens.css">
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr;
            min-height: 100vh;
        }
        @media (min-width: 1024px) {
            .container {
                grid-template-columns: 320px 1fr 320px;
            }
        }
        .panel {
            padding: 44px;
            border-right: 1px solid var(--hairline-thick);
            display: flex;
            flex-direction: column;
            gap: 22px;
        }
        canvas {
            width: 100%;
            height: 100%;
            mix-blend-mode: multiply;
        }
        .bar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 8px 0;
            gap: 8px;
        }
        .bar-container {
            flex-grow: 1;
            height: 6px;
            background: var(--hairline-thin);
            margin: 0 10px;
        }
        .bar-fill {
            height: 100%;
            background: var(--red);
            transition: width 0.5s ease;
        }
        .nlq-container {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 22px;
            background: var(--paper);
            border-top: 2px solid var(--ink);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }
        .nlq-row {
            display: flex;
            gap: 12px;
        }
        .nlq-response {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--red);
            display: none;
        }
    </style>
</head>
<body class="grid-bg">
    <div class="container">
        <!-- Left Panel: Trends -->
        <div class="panel">
            <div class="headline" style="font-size: 32px;">TRENDS</div>
            <div class="mono" id="trendsSource" style="color:var(--grey)">LOADING DATA...</div>
            
            <div id="trendsList" class="rule-section" style="padding-top:22px;">
                <div class="mono" style="color:var(--grey)">FETCHING TRENDS...</div>
            </div>
        </div>

        <!-- Center Panel: Graph -->
        <div class="panel" style="padding: 0; overflow: hidden; position: relative;">
            <canvas id="campaignGraph"></canvas>
            <div style="position:absolute; top:44px; left:44px; font-size: 32px;" class="headline">CAMPAIGN GRAPH</div>
        </div>

        <!-- Right Panel: Recent -->
        <div class="panel" style="border-right: none;">
            <div class="headline" style="font-size: 32px;">RECENT</div>
            <div class="mono" id="campaignsSource" style="color:var(--grey)">ACTIVE CAMPAIGNS</div>
            
            <div id="campaignsList" class="rule-section" style="padding-top:22px;">
                <div class="mono" style="color:var(--grey)">FETCHING CAMPAIGNS...</div>
            </div>
        </div>
    </div>
    
    <!-- NLQ Query Bar -->
    <div class="nlq-container">
        <div class="nlq-response" id="queryResponse"></div>
        <div class="nlq-row">
            <span class="mono" style="align-self:center;">ASK DATA:</span>
            <input type="text" id="queryInput" placeholder="e.g. KYC, C-0042, or active tactics" style="flex-grow:1; padding:12px; border:1px solid var(--ink); background:transparent; font-family:var(--font-archivo);">
            <button class="red" id="queryBtn">QUERY</button>
        </div>
    </div>

    <script src="/static/dist/reveal.js"></script>
    <script src="/static/dist/radar.js"></script>
</body>
</html>
